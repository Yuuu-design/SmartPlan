<title>SHENGHU SmartPlan · 答辩演示</title>
<style>

    --bg: #f5f5f7;
    --bg-elevated: #ffffff;
    --bg-panel: rgba(255,255,255,0.78);
    --bg-panel-solid: #ffffff;
    --border: rgba(0,0,0,0.1);
    --grid: rgba(0,0,0,0.055);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --text-dim: #6e6e73;
    --accent: #0a84ff;
    --blue: #0a84ff;
    --cyan: #007aff;
    --purple: #5e5ce6;
    --green: #34c759;
    --yellow: #ffcc00;
    --orange: #ff9500;
    --red: #ff3b30;
    --red-bright: #ff3b30;
    --mono: 'SF Mono','JetBrains Mono','Menlo','Consolas',monospace;
    --font-xs: 12px;
    --font-sm: 13px;
    --font-base: 14px;
    --font-md: 16px;
    --font-lg: 20px;
    --font-xl: 28px;
    --font-2xl: 36px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 22px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:var(--font-base);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;

  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===================== 答辩演示页 ===================== */
.presentation{position:fixed;inset:0;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.present-viewport{height:100%;overflow:hidden}
.present-slide{height:100%;padding:72px 88px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.present-exit{position:absolute;top:20px;right:24px;z-index:10;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.05);border:1px solid var(--border);color:var(--text-secondary);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:var(--font-sm);transition:all .15s ease}
.present-exit:hover{background:rgba(0,0,0,0.08);color:var(--text)}
.present-nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:10}
.present-arrow{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.06);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease}
.present-arrow:hover:not(:disabled){background:var(--accent);color:#fff}
.present-arrow:disabled{opacity:.3;cursor:default}
.present-dots{display:flex;gap:10px}
.present-dot{width:9px;height:9px;border-radius:50%;border:none;background:rgba(0,0,0,0.15);cursor:pointer;transition:all .3s ease}
.present-dot.active{background:var(--accent);width:28px;border-radius:5px}
.present-hint{position:absolute;bottom:16px;right:24px;font-size:var(--font-xs);color:var(--text-tertiary)}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.fade-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards}

.present-slide.cover{align-items:flex-start;justify-content:center;gap:34px;position:relative}
.cover-glow{position:absolute;top:-20%;right:-10%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(10,132,255,.12),transparent 60%);border-radius:50%;animation:glowFloat 8s ease-in-out infinite}
@keyframes glowFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.08)}}
.cover-logo{display:flex;align-items:center;gap:10px;font-size:var(--font-lg);font-weight:700;letter-spacing:.02em}
.present-slide.cover h1{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.15;max-width:800px;background:linear-gradient(120deg,#1d1d1f 30%,#0a84ff 70%,#007aff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cover-sub{font-size:var(--font-lg);color:var(--text-secondary);max-width:640px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px}
.cover-tag{padding:8px 16px;background:rgba(10,132,255,.08);color:var(--accent);border-radius:999px;font-size:var(--font-sm);font-weight:600}

.slide-kicker{font-size:var(--font-sm);color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.slide-title{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.25;max-width:860px}
.slide-foot{font-size:var(--font-lg);color:var(--text-secondary);max-width:760px;line-height:1.75;margin-top:28px}

.pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:52px 0;max-width:1040px}
.pain-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 32px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease}
.pain-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.pain-card h3{font-size:var(--font-xl);font-weight:600}
.pain-card p{font-size:var(--font-md);color:var(--text-secondary);line-height:1.6}

.arch-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.arch-node{padding:12px 20px;border-radius:var(--radius-md);background:var(--bg-elevated);border:1px solid var(--border);font-weight:600;font-size:var(--font-base)}
.arch-core{background:var(--accent);color:#fff;border-color:var(--accent)}
.arch-ai{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;border:none}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:44px 0;max-width:1040px}
.present-kpi{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.present-kpi-label{font-size:var(--font-md);color:var(--text-secondary);font-weight:600}
.present-kpi-value{font-family:var(--mono);font-size:52px;font-weight:700;letter-spacing:-.02em}

.chart-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-sm)}
.chart-title{font-size:var(--font-md);font-weight:600;margin-bottom:18px}

.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px;max-width:1080px}
.opt-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 32px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.opt-pct{font-size:52px;font-weight:700;color:var(--accent);font-family:var(--mono);letter-spacing:-.02em}
.opt-label{font-size:var(--font-lg);font-weight:600}
.opt-detail{font-size:var(--font-base);color:var(--text-secondary);line-height:1.6}

.improve-side{border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.improve-side.pain{background:rgba(255,59,48,.06);border:1px solid rgba(255,59,48,.18)}
.improve-side.fix{background:rgba(10,132,255,.06);border:1px solid rgba(10,132,255,.22)}
.improve-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.improve-side.pain .improve-tag{color:var(--red)}
.improve-side.fix .improve-tag{color:var(--accent)}
.improve-side p{font-size:var(--font-base);line-height:1.7;color:var(--text-secondary)}

.improve-effect{display:inline-flex;align-items:center;gap:6px;font-size:var(--font-sm);font-weight:600;color:var(--accent);background:rgba(10,132,255,.08);padding:5px 14px;border-radius:999px;align-self:flex-start}

.improve-fig{flex:1;min-width:0;margin:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column}
.improve-fig img{width:100%;height:400px;object-fit:contain;object-position:center center;background:#fff;display:block}
.improve-fig-placeholder{width:100%;height:400px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);color:var(--text-tertiary);font-size:12px}
.improve-fig figcaption{font-size:var(--font-sm);color:var(--text-secondary);padding:8px 10px;text-align:center;border-top:1px solid var(--grid);background:var(--bg-elevated)}

.imp-single{display:flex;flex-direction:column;gap:22px;margin-top:28px;max-width:1120px}
.imp-single-text{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.imp-arrow{display:flex;align-items:center;justify-content:center}
.imp-single-fig{display:flex;gap:16px}
.imp-single .improve-effect{align-self:flex-start}

.resched-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:40px 0;max-width:1120px}

.close-ring{position:relative;width:460px;height:460px;margin:44px auto;flex-shrink:0}
.close-ring-dash{position:absolute;inset:20px;border:2px dashed rgba(10,132,255,.22);border-radius:50%;animation:ringSpin 36s linear infinite}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.close-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:var(--font-md);box-shadow:0 16px 40px rgba(10,132,255,.35)}
.close-item{position:absolute;top:50%;left:50%;margin:-50px 0 0 -50px;width:100px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.close-item-num{position:absolute;top:-6px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:var(--font-xs);font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.close-item-label{font-size:var(--font-xs);font-weight:600;color:var(--text);white-space:nowrap}

.kpi-charts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1320px;width:100%}
.opt-charts{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:44px 0 32px;max-width:1120px}
@media(max-width:1200px){.kpi-charts{grid-template-columns:repeat(2,1fr)}}
</style>

<script type="text/babel" data-presets="react">
const { useEffect, useMemo, useRef, useState } = React;

/* ===================== 图标组件 ===================== */
const ICON_PATHS = {

  layers: 'm12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z m22 12-8.58 3.91a2 2 0 0 1-1.66 0L2.6 12 m22 17-8.58 3.91a2 2 0 0 1-1.66 0L2.6 17',

  lock: 'M3 11h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M7 11V7a5 5 0 0 1 10 0v4',
};

function Icon({ name, size = 20, color = 'currentColor', strokeWidth = 1.75, style }) {
  const d = ICON_PATHS[name] || '';
  // 兼容大写 M 和小写 m，M 后面可以是任意字符（数字或字母）
  const parts = d.split(/(?<=Z|z|[a-z0-9])\s+([Mm])/);
  // split 结果：[前半段, 'M'或'm', 后半段, 'M'或'm', ...]
  const paths = [];
  let i = 0;
  if (parts.length > 0 && parts[0]) {
    // 第一部分可能以小写 m 开头
    paths.push(parts[0]);
    i = 1;
  }
  for (; i < parts.length; i += 2) {
    if (i + 1 < parts.length && parts[i + 1]) {
      paths.push((parts[i] || 'M') + parts[i + 1]);
    }
  }
  return React.createElement('svg', {
    width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
    stroke: color, strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round',
    'aria-hidden': 'true', style
  }, paths.map((p, idx) => {
    // 确保 path 以 M/m 开头
    const fixed = /^[Mm]/.test(p) ? p : 'M' + p;
    return React.createElement('path', { key: idx, d: fixed });
  }));
}

/* ===================== ECharts 包装 ===================== */
function EChart({ option, height = 240 }) {
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (!inst.current) inst.current = echarts.init(ref.current);
    inst.current.setOption(option, true);
    return () => { if (inst.current) inst.current.dispose(); inst.current = null; };
  }, []);
  useEffect(() => { if (inst.current) inst.current.setOption(option); }, [option]);
  return React.createElement('div', { ref, style: { width: '100%', height } });
}

/* ===================== 颜色与工具 ===================== */
const C = {
  blue:'#0a84ff', cyan:'#007aff', green:'#34c759', yellow:'#ffcc00',
  orange:'#ff9500', red:'#ff3b30', purple:'#5e5ce6', text:'#1d1d1f',
  text2:'#6e6e73', grid:'rgba(0,0,0,0.06)',
};
const PROC_CN = { Drawing:'拉丝', Stranding:'捻股', Roping:'合绳' };

function cubicBezier(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx;
  const cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, sdx=t=>(3*ax*t+2*bx)*t+cx;
  const solve=x=>{let t=x;for(let i=0;i<8;i++){const e=sx(t)-x;if(Math.abs(e)<1e-6)return t;const d=sdx(t);if(Math.abs(d)<1e-6)break;t-=e/d;}let lo=0,hi=1;t=x;while(lo<hi){const e=sx(t);if(Math.abs(e-x)<1e-6)return t;if(x>e)lo=t;else hi=t;t=(hi-lo)/2+lo;}return t;};
  return k=>(k<=0?0:k>=1?1:sy(solve(k)));
}
const EASE = {
  barBounce:'bounceOut', pieElastic:'elasticOut', barQuartic:'quarticOut',
  lineSmooth:'cubicInOut', radarSmooth:'cubicInOut',
  compareBack:cubicBezier(.34,1.56,.64,1), tensionBack:cubicBezier(.68,-.55,.265,1.55),
};

function CountUp({ value, decimals=0, suffix='', duration=1400 }) {
  const [display, setDisplay] = useState(0);
  useEffect(() => {
    let raf=0; const start=performance.now();
    const tick=now=>{const t=Math.min(1,(now-start)/duration);const e=1-Math.pow(1-t,3);setDisplay(value*e);if(t<1)raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf);
  }, [value, duration]);
  return React.createElement('span', null, display.toFixed(decimals), suffix);
}

function computeStats(tasks) {
  const machineLoad=new Map(), machineSetup=new Map();
  const procCount={Drawing:0,Stranding:0,Roping:0}, setupByProc={Drawing:0,Stranding:0,Roping:0};
  const orderEnd=new Map();
  for(const t of tasks){
    machineLoad.set(t.machine_id,(machineLoad.get(t.machine_id)??0)+t.duration_minutes);
    if(t.setup_time>0) machineSetup.set(t.machine_id,(machineSetup.get(t.machine_id)??0)+1);
    procCount[t.process_type]++;
    if(t.setup_time>0) setupByProc[t.process_type]++;
    if(t.process_type==='Roping') orderEnd.set(t.order_id,t.end_time);
  }
  return {
    loadRank:Array.from(machineLoad.entries()).sort((a,b)=>b[1]-a[1]).slice(0,8),
    setupRank:Array.from(machineSetup.entries()).sort((a,b)=>b[1]-a[1]).slice(0,8),
    procCount, setupByProc,
    finishTimes:Array.from(orderEnd.values()).sort((a,b)=>a-b),
  };
}

/* ===================== Mock 数据（不依赖后端） ===================== */
function genMockSchedule() {
  const procs = ['Drawing','Stranding','Roping'];
  const machineMap = { Drawing:[], Stranding:[], Roping:[] };
  for(let i=0;i<28;i++) machineMap.Drawing.push('81'+String(100+i).slice(-3));
  for(let i=0;i<47;i++) machineMap.Stranding.push('82'+String(100+i).slice(-3));
  for(let i=0;i<12;i++) machineMap.Roping.push('83'+String(100+i).slice(-3));
  const tasks = [];
  let tid = 0, t = 0;
  for(let o=0; o<50; o++){
    const orderId = '2901-'+String(20260800001+o);
    const start = o * 30 + Math.floor(Math.random()*20);
    procs.forEach((p, pi) => {
      const m = machineMap[p][o % machineMap[p].length];
      const dur = 60 + Math.floor(Math.random()*300);
      const setup = pi > 0 && Math.random() < 0.5 ? 15 + Math.floor(Math.random()*45) : 0;
      tasks.push({
        task_id: 'T-'+(tid++), order_id: orderId, process_type: p,
        machine_id: m, machine_name: m, spec: '12mm GT6Z', qty_meters: 1000,
        start_time: start + t, end_time: start + t + dur,
        duration_minutes: dur, setup_time: setup, is_locked: false, status: 'ON_TIME',
      });
      t += 5;
    });
  }
  const totalMach = 87;
  const totalDur = tasks.reduce((s,t)=>s+t.duration_minutes,0);
  const span = Math.max(...tasks.map(t=>t.end_time)) - Math.min(...tasks.map(t=>t.start_time));
  return {
    scheduled_tasks: tasks,
    kpis: {
      otd: 0.98, utilization: 0.87, makespan: span,
      utilization_by_process: { Drawing:0.59, Stranding:0.88, Roping:0.88 },
      total_setup_count: 54, tardy_orders: 1,
    },
    decision_reasons: [],
  };
}

function genMockSimulation() {
  const baseline = genMockSchedule();
  const scenarios = [
    { name:'方案A·保交期', otd:1.0, total_perturbation_min:3391, disrupted_tasks:12, result:genMockSchedule() },
    { name:'方案B·少扰动', otd:0.98, total_perturbation_min:0, disrupted_tasks:12, result:genMockSchedule() },
    { name:'方案C·高效率', otd:0.98, total_perturbation_min:4688, disrupted_tasks:17, result:genMockSchedule() },
  ];
  return { baseline, scenarios };
}

const mockSchedule = genMockSchedule();
const mockSim = genMockSimulation();

/* ===================== 5 项改进数据 ===================== */
const IMPROVEMENTS = [

/* ===================== 主组件 ===================== */
const SLIDE_COUNT = 11;

function Presentation(){
  const [current,setCurrent]=useState(0);
  const kpi = mockSchedule;
  const sim = mockSim;
  const stats = useMemo(()=>computeStats(kpi.scheduled_tasks),[kpi]);

  useEffect(()=>{
    const onKey=e=>{
      if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') setCurrent(c=>Math.min(c+1,SLIDE_COUNT-1));
      if(e.key==='ArrowLeft'||e.key==='PageUp') setCurrent(c=>Math.max(c-1,0));
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[]);

  const go=d=>setCurrent(c=>Math.min(SLIDE_COUNT-1,Math.max(0,c+d)));

  const slides=[
    h(SlideCover,{key:'cover'}),
    h(SlideProblem,{key:'problem'}),
    h(SlideImprovement,{key:'imp1',index:0}),
    h(SlideImprovement,{key:'imp2',index:1}),
    h(SlideImprovement,{key:'imp3',index:2}),
    h(SlideImprovement,{key:'imp4',index:3}),
    h(SlideImprovement,{key:'imp5',index:4}),
    h(SlideKPI,{key:'kpi',kpi,stats}),
    h(SlideOptimization,{key:'opt',stats}),
    h(SlideReschedule,{key:'resched',sim}),
    h(SlideClose,{key:'close'}),
  ];

  return h('div',{className:'presentation'},
    h('div',{className:'present-viewport',key:current}, slides[current]),
    h('div',{className:'present-nav'},
      h('button',{className:'present-arrow',onClick:()=>go(-1),disabled:current===0},
        h(Icon,{name:'arrow-right',size:20,style:{transform:'rotate(180deg)'}})),
      h('div',{className:'present-dots'},
        Array.from({length:SLIDE_COUNT}).map((_,i)=>h('button',{key:i,className:'present-dot'+(i===current?' active':''),onClick:()=>setCurrent(i)}))
      ),
      h('button',{className:'present-arrow',onClick:()=>go(1),disabled:current===SLIDE_COUNT-1},
        h(Icon,{name:'arrow-right',size:20}))
    ),
    h('div',{className:'present-hint'},'← → 键切换 · 共 '+SLIDE_COUNT+' 幕')
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Presentation));
</script>
</body>
</html>
